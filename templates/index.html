<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة أكواد الاشتراك</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- شريط تنبيه تعذر الاتصال -->
    <div id="db-alert" class="db-alert hidden">
        ⚠️ <span id="db-alert-msg">تعذّر الاتصال بقاعدة البيانات</span>
        <button onclick="loadSubs()">🔄 إعادة المحاولة</button>
    </div>

    <div class="container">
        <h1>📋 لوحة إدارة أكواد الاشتراك</h1>

        <!-- نموذج إضافة/تعديل -->
        <div class="form-card">
            <h2 id="form-title">➕ إضافة كود اشتراك جديد</h2>
            <form id="sub-form">
                <input type="hidden" id="sub-code-hidden">

                <div>
                    <label for="code">كود الاشتراك *</label>
                    <input type="text" id="code" placeholder="مثال: ABC-123-XYZ" required>
                </div>

                <div>
                    <label for="plan_label">اسم الباقة *</label>
                    <input type="text" id="plan_label" placeholder="مثال: باقة سنوية" value="اشتراك مفعل" required>
                </div>

                <div>
                    <label for="duration_minutes">المدة (بالدقائق)</label>
                    <input type="number" id="duration_minutes" min="0" step="1" value="43200"
                           placeholder="43200 = 30 يوم">
                </div>

                <div>
                    <label for="max_contacts">الحد الأقصى لجهات الاتصال</label>
                    <input type="number" id="max_contacts" min="0" step="1" placeholder="اتركه فارغاً = بلا حد">
                </div>

                <div>
                    <label for="used_contacts">جهات الاتصال المستهلكة</label>
                    <input type="number" id="used_contacts" min="0" step="1" value="0">
                </div>

                <div>
                    <label for="bound_user_id">معرف المستخدم المرتبط</label>
                    <input type="text" id="bound_user_id" placeholder="user_id (اختياري)">
                </div>

                <div>
                    <label for="bound_ip">عنوان IP المرتبط</label>
                    <input type="text" id="bound_ip" placeholder="مثال: 1.2.3.4 (اختياري)">
                </div>

                <div>
                    <label for="expires_at">تاريخ الانتهاء (epoch ms)</label>
                    <input type="number" id="expires_at" step="1" placeholder="اتركه فارغاً للتفعيل التلقائي">
                </div>

                <label class="checkbox-row">
                    <input type="checkbox" id="is_subscribed" checked>
                    <span>مشترك (is_subscribed)</span>
                </label>

                <label class="checkbox-row">
                    <input type="checkbox" id="is_active" checked>
                    <span>مفعّل (is_active)</span>
                </label>

                <label class="checkbox-row">
                    <input type="checkbox" id="is_trial">
                    <span>باقة تجريبية (is_trial)</span>
                </label>

                <label class="checkbox-row">
                    <input type="checkbox" id="is_lifetime">
                    <span>مدى الحياة (is_lifetime)</span>
                </label>

                <div style="grid-column:1/-1;">
                    <label for="notes">ملاحظات</label>
                    <textarea id="notes" placeholder="ملاحظات إدارية (اختياري)"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit">💾 حفظ</button>
                    <button type="button" onclick="resetForm()" class="btn-secondary">إلغاء</button>
                </div>
            </form>
        </div>

        <!-- جدول الاشتراكات -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>الكود</th>
                        <th>الباقة</th>
                        <th>المدة (د)</th>
                        <th>الحصة</th>
                        <th>المستخدم المرتبط</th>
                        <th>IP</th>
                        <th>الانتهاء</th>
                        <th>الحالة</th>
                        <th>ملاحظات</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="subs-table"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API = "/api/subscriptions";
        let retryTimer = null;

        /* ===== أدوات مساعدة ===== */
        function scheduleRetry() {
            if (retryTimer) return;
            retryTimer = setTimeout(() => { retryTimer = null; loadSubs(); }, 10000);
        }
        function cancelRetry() {
            if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
        }
        function showDbAlert(msg) {
            document.getElementById("db-alert-msg").textContent = msg;
            document.getElementById("db-alert").classList.remove("hidden");
        }
        function hideDbAlert() {
            document.getElementById("db-alert").classList.add("hidden");
        }

        async function safeFetch(url, options = {}) {
            try {
                const res = await fetch(url, options);
                if (!res.ok) {
                    let detail = `HTTP ${res.status}`;
                    try {
                        const data = await res.json();
                        detail = data.detail || data.message || JSON.stringify(data);
                    } catch { /* رد ليس JSON */ }
                    alert(`❌ ${detail}`);
                    return null;
                }
                return await res.json();
            } catch (err) {
                alert(`❌ فشل الاتصال بالخادم: ${err.message}`);
                return null;
            }
        }

        /* تنسيق التاريخ من epoch ms */
        function fmtEpoch(ms) {
            if (!ms) return "-";
            const d = new Date(Number(ms));
            if (isNaN(d.getTime())) return "-";
            return d.toLocaleDateString("ar-EG") + " " +
                   d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
        }

        function epochToInput(ms) {
            return ms ? String(ms) : "";
        }

        function statusBadge(s) {
            if (!s.is_active) return `<span class="status inactive">متوقف</span>`;
            if (s.expires_at && Date.now() >= Number(s.expires_at)) {
                return `<span class="status expired">منتهي</span>`;
            }
            if (s.is_subscribed) return `<span class="status active">نشط</span>`;
            return `<span class="status cancelled">غير مشترك</span>`;
        }

        function renderTable(data) {
            const tbody = document.getElementById("subs-table");
            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:24px;">لا توجد أكواد بعد</td></tr>`;
                return;
            }
            tbody.innerHTML = data.map(s => {
                const quota = s.max_contacts
                    ? `${s.used_contacts || 0} / ${s.max_contacts}`
                    : `${s.used_contacts || 0} / ∞`;
                const planBadges = [
                    s.is_trial ? '<span class="badge trial">تجريبي</span>' : '',
                    s.is_lifetime ? '<span class="badge lifetime">مدى الحياة</span>' : ''
                ].join("");

                return `
                <tr>
                    <td data-label="الكود" class="code-cell">${escapeHtml(s.code)}</td>
                    <td data-label="الباقة">${escapeHtml(s.plan_label || "-")}${planBadges}</td>
                    <td data-label="المدة (د)">${s.duration_minutes ?? "-"}</td>
                    <td data-label="الحصة">${quota}</td>
                    <td data-label="المستخدم المرتبط">${escapeHtml(s.bound_user_id || "-")}</td>
                    <td data-label="IP">${escapeHtml(s.bound_ip || "-")}</td>
                    <td data-label="الانتهاء">${s.is_lifetime ? "∞" : fmtEpoch(s.expires_at)}</td>
                    <td data-label="الحالة">${statusBadge(s)}</td>
                    <td data-label="ملاحظات">${escapeHtml(s.notes || "-")}</td>
                    <td data-label="إجراءات">
                        <button onclick='editSub(${JSON.stringify(s).replace(/'/g, "&#39;")})'>✏️</button>
                        <button class="btn-danger" onclick="deleteSub('${escapeHtml(s.code)}')">🗑️</button>
                    </td>
                </tr>`;
            }).join("");
        }

        function escapeHtml(str) {
            if (str == null) return "";
            return String(str)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        async function loadSubs() {
            try {
                const res = await fetch(API);
                if (!res.ok) {
                    let detail = "خطأ غير معروف";
                    try {
                        const errData = await res.json();
                        detail = errData.detail || errData.message || JSON.stringify(errData);
                    } catch { /* رد ليس JSON */ }
                    showDbAlert(`تعذّر تحميل الأكواد: ${detail}`);
                    document.getElementById("subs-table").innerHTML = "";
                    scheduleRetry();
                    return;
                }
                hideDbAlert();
                cancelRetry();
                const data = await res.json();
                renderTable(data);
            } catch (err) {
                showDbAlert(`فشل الاتصال بالخادم: ${err.message}`);
                document.getElementById("subs-table").innerHTML = "";
                scheduleRetry();
            }
        }

        /* ===== إرسال النموذج ===== */
        document.getElementById("sub-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const originalCode = document.getElementById("sub-code-hidden").value;
            const isEdit = !!originalCode;

            const body = {
                code: document.getElementById("code").value.trim().toUpperCase(),
                plan_label: document.getElementById("plan_label").value.trim(),
                is_subscribed: document.getElementById("is_subscribed").checked,
                is_active: document.getElementById("is_active").checked,
                is_trial: document.getElementById("is_trial").checked,
                is_lifetime: document.getElementById("is_lifetime").checked,
                duration_minutes: parseInt(document.getElementById("duration_minutes").value, 10) || 0,
                max_contacts: document.getElementById("max_contacts").value
                    ? parseInt(document.getElementById("max_contacts").value, 10) : null,
                used_contacts: parseInt(document.getElementById("used_contacts").value, 10) || 0,
                bound_user_id: document.getElementById("bound_user_id").value.trim() || null,
                bound_ip: document.getElementById("bound_ip").value.trim() || null,
                expires_at: document.getElementById("expires_at").value
                    ? parseInt(document.getElementById("expires_at").value, 10) : null,
                notes: document.getElementById("notes").value.trim(),
            };

            const method = isEdit ? "PUT" : "POST";
            const url = isEdit ? `${API}/${encodeURIComponent(originalCode)}` : API;

            const result = await safeFetch(url, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });

            if (result) {
                resetForm();
                loadSubs();
            }
        });

        /* ===== تعديل ===== */
        function editSub(s) {
            document.getElementById("sub-code-hidden").value = s.code;
            document.getElementById("code").value = s.code;
            document.getElementById("plan_label").value = s.plan_label || "";
            document.getElementById("duration_minutes").value = s.duration_minutes ?? 43200;
            document.getElementById("max_contacts").value = s.max_contacts ?? "";
            document.getElementById("used_contacts").value = s.used_contacts ?? 0;
            document.getElementById("bound_user_id").value = s.bound_user_id || "";
            document.getElementById("bound_ip").value = s.bound_ip || "";
            document.getElementById("expires_at").value = epochToInput(s.expires_at);
            document.getElementById("is_subscribed").checked = !!s.is_subscribed;
            document.getElementById("is_active").checked = !!s.is_active;
            document.getElementById("is_trial").checked = !!s.is_trial;
            document.getElementById("is_lifetime").checked = !!s.is_lifetime;
            document.getElementById("notes").value = s.notes || "";
            document.getElementById("form-title").textContent = "✏️ تعديل الكود: " + s.code;
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        /* ===== حذف ===== */
        async function deleteSub(code) {
            if (!confirm(`هل أنت متأكد من حذف الكود "${code}"؟`)) return;
            const result = await safeFetch(`${API}/${encodeURIComponent(code)}`, { method: "DELETE" });
            if (result) loadSubs();
        }

        /* ===== إعادة تعيين ===== */
        function resetForm() {
            document.getElementById("sub-form").reset();
            document.getElementById("sub-code-hidden").value = "";
            document.getElementById("code").value = "";
            document.getElementById("plan_label").value = "اشتراك مفعل";
            document.getElementById("duration_minutes").value = 43200;
            document.getElementById("used_contacts").value = 0;
            document.getElementById("is_subscribed").checked = true;
            document.getElementById("is_active").checked = true;
            document.getElementById("form-title").textContent = "➕ إضافة كود اشتراك جديد";
        }

        loadSubs();
    </script>
</body>
</html>

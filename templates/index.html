<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة أكواد الاشتراك السنوي</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- شريط علوي للجوال -->
    <div class="mobile-topbar">
        <span class="mobile-title">📋 إدارة الاشتراكات السنوية</span>
        <button class="mobile-add-btn" onclick="scrollToForm()">➕ كود جديد</button>
    </div>

    <!-- شريط تنبيه تعذر الاتصال -->
    <div id="db-alert" class="db-alert hidden">
        ⚠️ <span id="db-alert-msg">تعذّر الاتصال بقاعدة البيانات</span>
        <button onclick="loadSubs()">🔄 إعادة المحاولة</button>
    </div>

    <div class="container">
        <h1>📋 لوحة إدارة أكواد الاشتراك السنوي</h1>

        <!-- نموذج إضافة/تعديل -->
        <div class="form-card" id="form-card">
            <h2 id="form-title">➕ إضافة كود اشتراك سنوي جديد</h2>
            <form id="sub-form">
                <input type="hidden" id="sub-code-hidden">

                <!-- الكود: للعرض فقط + زر توليد -->
                <div>
                    <label for="code">كود الاشتراك (يُولَّد تلقائياً)</label>
                    <div class="code-input-group">
                        <input type="text" id="code" readonly placeholder="سيتم توليده تلقائياً">
                        <button type="button" onclick="generateCode()" title="توليد كود جديد">🎲</button>
                    </div>
                </div>

                <!-- الحد الأقصى لجهات الاتصال -->
                <div>
                    <label for="max_contacts">الحد الأقصى لجهات الاتصال</label>
                    <select id="max_contacts">
                        <option value="">بلا حد (∞)</option>
                        <option value="100">100</option>
                        <option value="500">500</option>
                        <option value="1000">1000</option>
                        <option value="5000">5000</option>
                        <option value="10000">10000</option>
                    </select>
                </div>

                <!-- المستخدم المرتبط: بحث + اختيار من قاعدة البيانات -->
                <div class="user-picker" style="grid-column:1/-1;">
                    <label for="user-search">المستخدم المرتبط</label>
                    <div class="user-picker-box">
                        <input type="hidden" id="bound_user_id">
                        <input type="text" id="user-search"
                               placeholder="🔍 اكتب اسم المستخدم أو ID للبحث..."
                               autocomplete="off">
                        <button type="button" class="user-clear" onclick="clearUser()" title="إزالة الربط">✖</button>
                        <div id="user-dropdown" class="user-dropdown hidden"></div>
                    </div>
                    <small id="user-selected-hint" class="user-hint"></small>
                </div>

                <!-- IP المرتبط -->
                <div>
                    <label for="bound_ip">عنوان IP المرتبط</label>
                    <input type="text" id="bound_ip" placeholder="مثال: 1.2.3.4 (اختياري)">
                </div>

                <!-- تاريخ الانتهاء -->
                <div>
                    <label for="expires_at">تاريخ الانتهاء (epoch ms)</label>
                    <input type="number" id="expires_at" step="1" placeholder="اتركه فارغاً للتفعيل التلقائي">
                </div>

                <label class="checkbox-row">
                    <input type="checkbox" id="is_active" checked>
                    <span>مفعّل</span>
                </label>

                <div style="grid-column:1/-1;">
                    <label for="notes">ملاحظات</label>
                    <textarea id="notes" placeholder="ملاحظات إدارية (اختياري)"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit">💾 حفظ</button>
                    <button type="button" onclick="resetForm()" class="btn-secondary">إلغاء</button>
                </div>
            </form>
        </div>

        <!-- جدول الاشتراكات -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>الكود</th>
                        <th>الحصة</th>
                        <th>المستخدم المرتبط</th>
                        <th>IP</th>
                        <th>الانتهاء</th>
                        <th>الحالة</th>
                        <th>ملاحظات</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="subs-table"></tbody>
            </table>
        </div>
    </div>

    <!-- زر عائم للجوال -->
    <button class="fab" onclick="scrollToForm()" title="إضافة كود">➕</button>

    <script>
        const API = "/api/subscriptions";
        const USERS_API = "/api/users";   // ← عدّل المسار حسب خادمك
        let retryTimer = null;

        /* ===== ثوابت الاشتراك السنوي ===== */
        const FIXED_PLAN_LABEL = "اشتراك سنوي";
        const FIXED_DURATION_MINUTES = 525600; // سنة واحدة

        /* ===== كاش المستخدمين ===== */
        let allUsers = [];
        let selectedUser = null;

        /* ===== التمرير للنموذج ===== */
        function scrollToForm() {
            const form = document.getElementById("form-card");
            form.scrollIntoView({ behavior: "smooth", block: "start" });
            setTimeout(() => {
                const el = document.getElementById("user-search");
                if (el) el.focus();
            }, 400);
        }

        /* ===== توليد كود اشتراك ===== */
        function generateCode() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            const groups = [4, 4, 4];
            const code = groups.map(len =>
                Array.from({ length: len }, () => chars[Math.floor(Math.random() * chars.length)]).join("")
            ).join("-");
            document.getElementById("code").value = code;
        }

        /* ===== أدوات مساعدة ===== */
        function scheduleRetry() {
            if (retryTimer) return;
            retryTimer = setTimeout(() => { retryTimer = null; loadSubs(); }, 10000);
        }
        function cancelRetry() {
            if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
        }
        function showDbAlert(msg) {
            document.getElementById("db-alert-msg").textContent = msg;
            document.getElementById("db-alert").classList.remove("hidden");
        }
        function hideDbAlert() {
            document.getElementById("db-alert").classList.add("hidden");
        }

        async function safeFetch(url, options = {}) {
            try {
                const res = await fetch(url, options);
                if (!res.ok) {
                    let detail = `HTTP ${res.status}`;
                    try {
                        const data = await res.json();
                        detail = data.detail || data.message || JSON.stringify(data);
                    } catch { /* رد ليس JSON */ }
                    alert(`❌ ${detail}`);
                    return null;
                }
                return await res.json();
            } catch (err) {
                alert(`❌ فشل الاتصال بالخادم: ${err.message}`);
                return null;
            }
        }

        function fmtEpoch(ms) {
            if (!ms) return "-";
            const d = new Date(Number(ms));
            if (isNaN(d.getTime())) return "-";
            return d.toLocaleDateString("ar-EG") + " " +
                   d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
        }
        function epochToInput(ms) { return ms ? String(ms) : ""; }

        function statusBadge(s) {
            if (!s.is_active) return `<span class="status inactive">متوقف</span>`;
            if (s.expires_at && Date.now() >= Number(s.expires_at)) {
                return `<span class="status expired">منتهي</span>`;
            }
            if (s.is_subscribed) return `<span class="status active">نشط</span>`;
            return `<span class="status cancelled">غير مشترك</span>`;
        }

        function escapeHtml(str) {
            if (str == null) return "";
            return String(str)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        /* ===== المستخدمون ===== */
        function userId(u) {
            return u.user_id ?? u.id ?? u.telegram_id ?? "";
        }
        function userName(u) {
            return u.name ?? u.username ?? u.full_name ?? u.first_name ?? userId(u);
        }

        async function loadUsers() {
            try {
                const res = await fetch(USERS_API);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allUsers = await res.json();
                if (document.getElementById("bound_user_id").value) {
                    const id = document.getElementById("bound_user_id").value;
                    const u = allUsers.find(x => String(userId(x)) === String(id));
                    if (u) selectUser(u, false);
                }
            } catch (err) {
                console.warn("تعذّر جلب المستخدمين:", err.message);
                const dd = document.getElementById("user-dropdown");
                dd.innerHTML = `<div class="user-empty">⚠️ تعذّر جلب المستخدمين: ${err.message}</div>`;
            }
        }

        function showUserDropdown(filter = "") {
            const dd = document.getElementById("user-dropdown");
            const q = filter.trim().toLowerCase();
            let list = allUsers;
            if (q) {
                list = allUsers.filter(u => {
                    const name = String(userName(u)).toLowerCase();
                    const id = String(userId(u)).toLowerCase();
                    return name.includes(q) || id.includes(q);
                });
            }
            const shown = list.slice(0, 50);
            if (!shown.length) {
                dd.innerHTML = `<div class="user-empty">لا توجد نتائج مطابقة</div>`;
            } else {
                dd.innerHTML = shown.map(u => `
                    <div class="user-item" onclick='selectUser(${JSON.stringify(u).replace(/'/g, "&#39;")})'>
                        <span class="user-name">${escapeHtml(String(userName(u)))}</span>
                        <span class="user-id">${escapeHtml(String(userId(u)))}</span>
                    </div>
                `).join("");
                if (list.length > 50) {
                    dd.innerHTML += `<div class="user-empty">… و ${list.length - 50} نتيجة أخرى (ضيّق البحث)</div>`;
                }
            }
            dd.classList.remove("hidden");
        }

        function selectUser(u, updateInput = true) {
            selectedUser = u;
            document.getElementById("bound_user_id").value = userId(u);
            if (updateInput) {
                document.getElementById("user-search").value = userName(u);
            }
            const hint = document.getElementById("user-selected-hint");
            hint.textContent = `✅ مرتبط بـ: ${userName(u)} (ID: ${userId(u)})`;
            hint.style.color = "var(--success)";
            document.getElementById("user-dropdown").classList.add("hidden");
        }

        function clearUser() {
            selectedUser = null;
            document.getElementById("bound_user_id").value = "";
            document.getElementById("user-search").value = "";
            const hint = document.getElementById("user-selected-hint");
            hint.textContent = "";
            document.getElementById("user-dropdown").classList.add("hidden");
        }

        function bindUserPicker() {
            const input = document.getElementById("user-search");
            const dd = document.getElementById("user-dropdown");
            input.addEventListener("input", () => showUserDropdown(input.value));
            input.addEventListener("focus", () => showUserDropdown(input.value));
            document.addEventListener("click", (e) => {
                if (!e.target.closest(".user-picker")) dd.classList.add("hidden");
            });
            input.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    const first = dd.querySelector(".user-item");
                    if (first && !dd.classList.contains("hidden")) first.click();
                } else if (e.key === "Escape") {
                    dd.classList.add("hidden");
                }
            });
        }

        /* ===== الجدول ===== */
        function renderTable(data) {
            const tbody = document.getElementById("subs-table");
            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:24px;">لا توجد أكواد بعد</td></tr>`;
                return;
            }
            tbody.innerHTML = data.map(s => {
                const quota = s.max_contacts
                    ? `${s.used_contacts || 0} / ${s.max_contacts}`
                    : `${s.used_contacts || 0} / ∞`;

                const userObj = allUsers.find(u => String(userId(u)) === String(s.bound_user_id));
                const userNameDisplay = userObj ? userName(userObj) : (s.bound_user_id || "-");

                return `
                <tr>
                    <td data-label="الكود" class="code-cell">${escapeHtml(s.code)}</td>
                    <td data-label="الحصة">${quota}</td>
                    <td data-label="المستخدم المرتبط">${escapeHtml(String(userNameDisplay))}</td>
                    <td data-label="IP">${escapeHtml(s.bound_ip || "-")}</td>
                    <td data-label="الانتهاء">${s.is_lifetime ? "∞" : fmtEpoch(s.expires_at)}</td>
                    <td data-label="الحالة">${statusBadge(s)}</td>
                    <td data-label="ملاحظات">${escapeHtml(s.notes || "-")}</td>
                    <td data-label="إجراءات">
                        <button onclick='editSub(${JSON.stringify(s).replace(/'/g, "&#39;")})'>✏️</button>
                        <button class="btn-danger" onclick="deleteSub('${escapeHtml(s.code)}')">🗑️</button>
                    </td>
                </tr>`;
            }).join("");
        }

        async function loadSubs() {
            try {
                const res = await fetch(API);
                if (!res.ok) {
                    let detail = "خطأ غير معروف";
                    try {
                        const errData = await res.json();
                        detail = errData.detail || errData.message || JSON.stringify(errData);
                    } catch { /* رد ليس JSON */ }
                    showDbAlert(`تعذّر تحميل الأكواد: ${detail}`);
                    document.getElementById("subs-table").innerHTML = "";
                    scheduleRetry();
                    return;
                }
                hideDbAlert();
                cancelRetry();
                const data = await res.json();
                renderTable(data);
            } catch (err) {
                showDbAlert(`فشل الاتصال بالخادم: ${err.message}`);
                document.getElementById("subs-table").innerHTML = "";
                scheduleRetry();
            }
        }

        /* ===== إرسال النموذج ===== */
        document.getElementById("sub-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const originalCode = document.getElementById("sub-code-hidden").value;
            const isEdit = !!originalCode;

            const codeValue = document.getElementById("code").value.trim().toUpperCase();
            if (!codeValue) { alert("❌ يرجى توليد كود أولاً"); return; }

            const body = {
                code: codeValue,
                plan_label: FIXED_PLAN_LABEL,
                is_subscribed: true,
                is_active: document.getElementById("is_active").checked,
                is_trial: false,
                is_lifetime: false,
                duration_minutes: FIXED_DURATION_MINUTES,
                max_contacts: document.getElementById("max_contacts").value
                    ? parseInt(document.getElementById("max_contacts").value, 10) : null,
                used_contacts: 0,
                bound_user_id: document.getElementById("bound_user_id").value || null,
                bound_ip: document.getElementById("bound_ip").value.trim() || null,
                expires_at: document.getElementById("expires_at").value
                    ? parseInt(document.getElementById("expires_at").value, 10) : null,
                notes: document.getElementById("notes").value.trim(),
            };

            const method = isEdit ? "PUT" : "POST";
            const url = isEdit ? `${API}/${encodeURIComponent(originalCode)}` : API;

            const result = await safeFetch(url, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });

            if (result) {
                resetForm();
                loadSubs();
            }
        });

        /* ===== تعديل ===== */
        function editSub(s) {
            document.getElementById("sub-code-hidden").value = s.code;
            document.getElementById("code").value = s.code;
            document.getElementById("max_contacts").value = s.max_contacts ?? "";
            document.getElementById("bound_ip").value = s.bound_ip || "";
            document.getElementById("expires_at").value = epochToInput(s.expires_at);
            document.getElementById("is_active").checked = !!s.is_active;
            document.getElementById("notes").value = s.notes || "";

            if (s.bound_user_id) {
                const u = allUsers.find(x => String(userId(x)) === String(s.bound_user_id));
                if (u) {
                    selectUser(u);
                } else {
                    document.getElementById("bound_user_id").value = s.bound_user_id;
                    document.getElementById("user-search").value = s.bound_user_id;
                    const hint = document.getElementById("user-selected-hint");
                    hint.textContent = `⚠️ مستخدم غير موجود في القائمة (ID: ${s.bound_user_id})`;
                    hint.style.color = "var(--warning)";
                }
            } else {
                clearUser();
            }

            document.getElementById("form-title").textContent = "✏️ تعديل الكود: " + s.code;
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        /* ===== حذف ===== */
        async function deleteSub(code) {
            if (!confirm(`هل أنت متأكد من حذف الكود "${code}"؟`)) return;
            const result = await safeFetch(`${API}/${encodeURIComponent(code)}`, { method: "DELETE" });
            if (result) loadSubs();
        }

        /* ===== إعادة تعيين ===== */
        function resetForm() {
            document.getElementById("sub-form").reset();
            document.getElementById("sub-code-hidden").value = "";
            document.getElementById("code").value = "";
            document.getElementById("max_contacts").value = "";
            document.getElementById("is_active").checked = true;
            document.getElementById("form-title").textContent = "➕ إضافة كود اشتراك سنوي جديد";
            clearUser();
            generateCode();
        }

        /* ===== التهيئة ===== */
        bindUserPicker();
        generateCode();
        loadUsers();
        loadSubs();
    </script>
</body>
</html>

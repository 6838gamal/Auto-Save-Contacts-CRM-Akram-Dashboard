<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الاشتراكات</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- شريط تنبيه تعذر الاتصال -->
    <div id="db-alert" class="db-alert hidden">
        ⚠️ <span id="db-alert-msg">تعذّر الاتصال بقاعدة البيانات</span>
        <button onclick="loadSubs()">🔄 إعادة المحاولة</button>
    </div>

    <div class="container">
        <h1>📋 لوحة إدارة الاشتراكات</h1>

        <!-- نموذج إضافة/تعديل -->
        <div class="form-card">
            <h2 id="form-title">➕ إضافة اشتراك جديد</h2>
            <form id="sub-form">
                <input type="hidden" id="sub-id">
                <input type="text" id="subscriber_name" placeholder="اسم المشترك" required>
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
                <input type="text" id="phone" placeholder="الهاتف">
                <select id="plan_name" required>
                    <option value="">اختر الخطة</option>
                    <option value="Basic">Basic</option>
                    <option value="Pro">Pro</option>
                    <option value="Premium">Premium</option>
                </select>
                <input type="number" step="0.01" id="price" placeholder="السعر" required>
                <label>تاريخ البداية:</label>
                <input type="date" id="start_date" required>
                <label>تاريخ النهاية:</label>
                <input type="date" id="end_date" required>
                <select id="status">
                    <option value="active">نشط</option>
                    <option value="expired">منتهي</option>
                    <option value="cancelled">ملغى</option>
                </select>
                <button type="submit">حفظ</button>
                <button type="button" onclick="resetForm()" class="btn-secondary">إلغاء</button>
            </form>
        </div>

        <!-- جدول الاشتراكات -->
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>الاسم</th>
                    <th>البريد</th>
                    <th>الهاتف</th>
                    <th>الخطة</th>
                    <th>السعر</th>
                    <th>من</th>
                    <th>إلى</th>
                    <th>الحالة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="subs-table"></tbody>
        </table>
    </div>

    <script>
        const API = "/api/subscriptions";
        let retryTimer = null;

        function scheduleRetry() {
            if (retryTimer) return;
            retryTimer = setTimeout(() => {
                retryTimer = null;
                loadSubs();
            }, 10000);
        }

        function cancelRetry() {
            if (retryTimer) {
                clearTimeout(retryTimer);
                retryTimer = null;
            }
        }

        function showDbAlert(msg) {
            const alertBox = document.getElementById("db-alert");
            document.getElementById("db-alert-msg").textContent = msg;
            alertBox.classList.remove("hidden");
        }

        function hideDbAlert() {
            document.getElementById("db-alert").classList.add("hidden");
        }

        // دالة fetch آمنة للاستخدام مع كل الطلبات
        async function safeFetch(url, options = {}) {
            try {
                const res = await fetch(url, options);
                if (!res.ok) {
                    let detail = `HTTP ${res.status}`;
                    try {
                        const data = await res.json();
                        detail = data.detail || data.message || JSON.stringify(data);
                    } catch { /* رد ليس JSON */ }
                    alert(`❌ ${detail}`);
                    return null;
                }
                return await res.json();
            } catch (err) {
                alert(`❌ فشل الاتصال بالخادم: ${err.message}`);
                return null;
            }
        }

        function statusAr(s) {
            return { active: "نشط", expired: "منتهي", cancelled: "ملغى" }[s] || s;
        }

        function renderTable(data) {
            const tbody = document.getElementById("subs-table");
            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="10">لا توجد اشتراكات بعد</td></tr>`;
                return;
            }
            tbody.innerHTML = data.map(s => `
                <tr>
                    <td>${s.id}</td>
                    <td>${s.subscriber_name}</td>
                    <td>${s.email}</td>
                    <td>${s.phone || "-"}</td>
                    <td>${s.plan_name}</td>
                    <td>${s.price}</td>
                    <td>${s.start_date}</td>
                    <td>${s.end_date}</td>
                    <td><span class="status ${s.status}">${statusAr(s.status)}</span></td>
                    <td>
                        <button onclick='editSub(${JSON.stringify(s)})'>✏️</button>
                        <button class="btn-danger" onclick="deleteSub(${s.id})">🗑️</button>
                    </td>
                </tr>
            `).join("");
        }

        async function loadSubs() {
            try {
                const res = await fetch(API);

                if (!res.ok) {
                    let detail = "خطأ غير معروف";
                    try {
                        const errData = await res.json();
                        detail = errData.detail || errData.message || JSON.stringify(errData);
                    } catch { /* رد ليس JSON */ }

                    showDbAlert(`تعذّر تحميل الاشتراكات: ${detail}`);
                    document.getElementById("subs-table").innerHTML = "";
                    scheduleRetry();
                    return;
                }

                hideDbAlert();
                cancelRetry();
                const data = await res.json();
                renderTable(data);

            } catch (err) {
                showDbAlert(`فشل الاتصال بالخادم: ${err.message}`);
                document.getElementById("subs-table").innerHTML = "";
                scheduleRetry();
            }
        }

        document.getElementById("sub-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = document.getElementById("sub-id").value;
            const body = {
                subscriber_name: document.getElementById("subscriber_name").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                plan_name: document.getElementById("plan_name").value,
                price: parseFloat(document.getElementById("price").value),
                start_date: document.getElementById("start_date").value,
                end_date: document.getElementById("end_date").value,
                status: document.getElementById("status").value,
            };

            const method = id ? "PUT" : "POST";
            const url = id ? `${API}/${id}` : API;

            const result = await safeFetch(url, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });

            if (result) {
                resetForm();
                loadSubs();
            }
        });

        function editSub(s) {
            document.getElementById("sub-id").value = s.id;
            document.getElementById("subscriber_name").value = s.subscriber_name;
            document.getElementById("email").value = s.email;
            document.getElementById("phone").value = s.phone || "";
            document.getElementById("plan_name").value = s.plan_name;
            document.getElementById("price").value = s.price;
            document.getElementById("start_date").value = s.start_date;
            document.getElementById("end_date").value = s.end_date;
            document.getElementById("status").value = s.status;
            document.getElementById("form-title").textContent = "✏️ تعديل الاشتراك";
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        async function deleteSub(id) {
            if (!confirm("هل أنت متأكد من الحذف؟")) return;
            const result = await safeFetch(`${API}/${id}`, { method: "DELETE" });
            if (result) loadSubs();
        }

        function resetForm() {
            document.getElementById("sub-form").reset();
            document.getElementById("sub-id").value = "";
            document.getElementById("form-title").textContent = "➕ إضافة اشتراك جديد";
        }

        loadSubs();
    </script>
</body>
</html>
